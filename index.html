<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Kids Daily Stars</title>
<style>
  :root{
    --bg:#f7f8fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
    --accent:#7c3aed;
    --accent2:#2563eb;
    --good:#16a34a;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  .app{max-width:900px;margin:0 auto;padding:18px 18px 100px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
  .brand{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .month-pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-weight:700}
  .profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .profile{
    background:var(--card); border:2px solid transparent; border-radius:18px;
    padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer;
    box-shadow:0 4px 14px rgba(31,41,55,.05);
  }
  .profile.active{border-color:var(--accent)}
  .avatar{
    width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    background:#ede9fe;font-size:30px
  }
  .pname{font-size:20px;font-weight:800}
  .pscore{font-size:14px;color:var(--muted);margin-top:3px}
  .hero{
    background:linear-gradient(135deg,#ffffff,#f5f3ff);
    border:1px solid var(--border); border-radius:24px; padding:22px;
    box-shadow:0 8px 24px rgba(31,41,55,.05); margin-bottom:18px;
  }
  .hero h1{margin:0 0 6px;font-size:32px}
  .sub{color:var(--muted);font-size:16px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}
  .stat .num{font-size:28px;font-weight:900}
  .stat .label{color:var(--muted);font-size:13px;margin-top:2px}
  .progress{margin-top:16px;background:#e5e7eb;height:14px;border-radius:999px;overflow:hidden}
  .progress>div{height:100%;background:var(--accent);width:0%;transition:width .25s}
  .section-title{font-size:20px;font-weight:800;margin:22px 0 10px}
  .task-list{display:grid;gap:10px}
  .task{
    display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--border);border-radius:16px;padding:14px 16px;
    box-shadow:0 3px 10px rgba(31,41,55,.04)
  }
  .task input{width:28px;height:28px;accent-color:var(--good);flex:0 0 auto}
  .task-main{flex:1}
  .task-name{font-size:18px;font-weight:750}
  .task-points{font-size:13px;color:var(--muted);margin-top:2px}
  .task.done{opacity:.65}
  .task.done .task-name{text-decoration:line-through}
  .spark{font-size:22px}
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);border-top:1px solid var(--border);
    display:flex;justify-content:center;z-index:50
  }
  .bottomnav .inner{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
  .navbtn{padding:14px 6px 18px;border:0;background:transparent;font-weight:700;color:var(--muted);font-size:14px}
  .navbtn.active{color:var(--accent)}
  .panel{display:none}
  .panel.active{display:block}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{
    background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 6px;
    min-height:78px;text-align:center
  }
  .day .dnum{font-weight:800}
  .day .dpts{margin-top:8px;font-size:12px;color:var(--muted)}
  .day.today{border:2px solid var(--accent)}
  .reward{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
  .reward h3{margin:0 0 4px}
  .reward small{color:var(--muted)}
  .parent-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text],input[type=number]{
    border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0
  }
  button.primary,button.secondary,button.danger{
    border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:800;cursor:pointer
  }
  .primary{background:var(--accent);color:#fff}
  .secondary{background:#eef2ff;color:#3730a3}
  .danger{background:#fee2e2;color:#991b1b}
  .edit-task{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin:8px 0}
  .toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:#111827;color:#fff;padding:12px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.2s;z-index:100;font-weight:800
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .monthly-total{
    text-align:center;background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;
    margin:10px 0 18px
  }
  .monthly-total .big{font-size:52px;font-weight:900;line-height:1}
  .monthly-total .caption{color:var(--muted);margin-top:8px}
  @media (max-width:620px){
    .brand{font-size:24px}.hero h1{font-size:28px}
    .profiles{grid-template-columns:1fr 1fr}
    .edit-task{grid-template-columns:1fr 72px;}.edit-task button{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="toast" id="toast">+5 ⭐ Great job!</div>
<div class="app">
  <div class="topbar">
    <div class="brand">Kids Daily Stars ⭐</div>
    <div class="month-pill" id="monthLabel"></div>
  </div>

  <div class="profiles" id="profiles"></div>

  <div id="todayPanel" class="panel active">
    <div class="hero">
      <h1 id="greeting">Good morning!</h1>
      <div class="sub" id="dateLabel"></div>
      <div class="stats">
        <div class="stat"><div class="num" id="todayPoints">0</div><div class="label">points today ⭐</div></div>
        <div class="stat"><div class="num" id="monthPoints">0</div><div class="label">points this month 🏆</div></div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="sub" id="progressText" style="margin-top:8px"></div>
    </div>

    <div class="section-title">Today’s Tasks</div>
    <div class="task-list" id="taskList"></div>
  </div>

  <div id="calendarPanel" class="panel">
    <div class="monthly-total">
      <div class="big" id="calendarMonthTotal">0 ⭐</div>
      <div class="caption" id="calendarMonthCaption"></div>
    </div>
    <div class="section-title">Daily totals</div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div id="rewardsPanel" class="panel">
    <div class="section-title">Rewards</div>
    <div id="rewardsList"></div>
  </div>

  <div id="parentPanel" class="panel">
    <div class="parent-card">
      <h2 style="margin-top:0">Parent Settings</h2>
      <p class="sub">Edit tasks and points for the currently selected child.</p>
      <div id="taskEditor"></div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="newTaskName" placeholder="New task" style="flex:1">
        <input type="number" id="newTaskPoints" value="5" min="1" style="width:90px">
        <button class="primary" onclick="addTask()">Add task</button>
      </div>
    </div>

    <div class="parent-card">
      <h3 style="margin-top:0">Bonus points</h3>
      <div class="row">
        <input type="number" id="bonusPoints" value="5" min="1" style="width:110px">
        <button class="secondary" onclick="addBonus()">Add bonus ⭐</button>
      </div>
    </div>

    <div class="parent-card">
      <h3 style="margin-top:0">Data</h3>
      <p class="sub">Everything is stored only on this iPad/browser.</p>
      <div class="row">
        <button class="secondary" onclick="exportData()">Export backup</button>
        <button class="danger" onclick="resetAll()">Reset all data</button>
      </div>
    </div>
  </div>
</div>

<div class="bottomnav">
  <div class="inner">
    <button class="navbtn active" data-panel="todayPanel">Today</button>
    <button class="navbtn" data-panel="calendarPanel">Calendar</button>
    <button class="navbtn" data-panel="rewardsPanel">Rewards</button>
    <button class="navbtn" data-panel="parentPanel">Parent</button>
  </div>
</div>

<script>
const STORAGE_KEY = "kidsDailyStars_v1";
const defaultState = {
  activeKid: "arka",
  kids: {
    arka: {
      name: "Arka",
      emoji: "🦁",
      tasks: [
        {id:"brush",name:"Brush teeth",points:2},
        {id:"dress",name:"Get dressed",points:2},
        {id:"bed",name:"Make bed",points:3},
        {id:"read",name:"Reading",points:5},
        {id:"homework",name:"Homework / practice",points:5},
        {id:"cleanup",name:"Put toys / things away",points:5},
        {id:"help",name:"Help Mom or Dad",points:3}
      ],
      history:{}
    },
    vayu: {
      name: "Vayu",
      emoji: "🐯",
      tasks: [
        {id:"brush",name:"Brush teeth",points:2},
        {id:"dress",name:"Get dressed",points:2},
        {id:"toys",name:"Put toys away",points:4},
        {id:"books",name:"Books / reading time",points:4},
        {id:"shoes",name:"Shoes / coat in place",points:2},
        {id:"help",name:"Help Mom or Dad",points:3}
      ],
      history:{}
    }
  },
  rewards: [
    {points:100,title:"Choose family movie night 🎬"},
    {points:200,title:"Pick a special treat 🍦"},
    {points:300,title:"Choose a family activity 🎨"},
    {points:500,title:"Monthly big reward 🎁"}
  ]
};

let state = loadState();

function loadState(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    return s?JSON.parse(s):structuredClone(defaultState);
  }catch(e){return structuredClone(defaultState);}
}
function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
function keyForDate(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function monthKey(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function getKid(){return state.kids[state.activeKid]}
function getDayRecord(dateKey=keyForDate()){
  const kid=getKid();
  if(!kid.history[dateKey]) kid.history[dateKey]={checked:{},bonus:0};
  return kid.history[dateKey];
}
function dayPoints(kid,dateKey){
  const rec=kid.history[dateKey]||{checked:{},bonus:0};
  let total=rec.bonus||0;
  for(const t of kid.tasks){ if(rec.checked && rec.checked[t.id]) total+=Number(t.points)||0; }
  return total;
}
function monthTotal(kid,mkey=monthKey()){
  return Object.keys(kid.history||{}).filter(k=>k.startsWith(mkey)).reduce((sum,k)=>sum+dayPoints(kid,k),0);
}
function possibleToday(kid){return kid.tasks.reduce((s,t)=>s+(Number(t.points)||0),0)}

function renderAll(){
  const now=new Date(), kid=getKid();
  document.getElementById("monthLabel").textContent=now.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  document.getElementById("dateLabel").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const hr=now.getHours(); const greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  document.getElementById("greeting").textContent=`${greet}, ${kid.name}! ${kid.emoji}`;
  renderProfiles();
  renderTasks();
  renderStats();
  renderCalendar();
  renderRewards();
  renderEditor();
  save();
}
function renderProfiles(){
  const wrap=document.getElementById("profiles"); wrap.innerHTML="";
  for(const [id,k] of Object.entries(state.kids)){
    const el=document.createElement("div"); el.className="profile"+(state.activeKid===id?" active":"");
    el.innerHTML=`<div class="avatar">${k.emoji}</div>
      <div><div class="pname">${k.name}</div><div class="pscore">${monthTotal(k)} points this month ⭐</div></div>`;
    el.onclick=()=>{state.activeKid=id;renderAll()};
    wrap.appendChild(el);
  }
}
function renderTasks(){
  const kid=getKid(), rec=getDayRecord(), wrap=document.getElementById("taskList"); wrap.innerHTML="";
  kid.tasks.forEach(t=>{
    const done=!!rec.checked[t.id];
    const row=document.createElement("label"); row.className="task"+(done?" done":"");
    row.innerHTML=`<input type="checkbox" ${done?"checked":""}>
      <div class="task-main"><div class="task-name">${escapeHtml(t.name)}</div><div class="task-points">+${t.points} points</div></div>
      <div class="spark">${done?"✅":"⭐"}</div>`;
    row.querySelector("input").onchange=(e)=>{
      rec.checked[t.id]=e.target.checked;
      if(e.target.checked) showToast(`+${t.points} ⭐ Great job!`);
      renderAll();
    };
    wrap.appendChild(row);
  });
}
function renderStats(){
  const kid=getKid(), today=dayPoints(kid,keyForDate()), month=monthTotal(kid), possible=possibleToday(kid);
  document.getElementById("todayPoints").textContent=today;
  document.getElementById("monthPoints").textContent=month;
  const pct=possible?Math.min(100,Math.round((today/possible)*100)):0;
  document.getElementById("progressBar").style.width=pct+"%";
  document.getElementById("progressText").textContent=`${today} / ${possible} regular task points today`;
}
function renderCalendar(){
  const now=new Date(), kid=getKid();
  const y=now.getFullYear(), m=now.getMonth(), first=new Date(y,m,1), last=new Date(y,m+1,0);
  const grid=document.getElementById("calendarGrid"); grid.innerHTML="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
    const h=document.createElement("div");h.className="sub";h.style.textAlign="center";h.style.fontWeight="800";h.textContent=d;grid.appendChild(h)
  });
  for(let i=0;i<first.getDay();i++){const b=document.createElement("div");grid.appendChild(b)}
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(y,m,d); const k=keyForDate(dt), pts=dayPoints(kid,k);
    const el=document.createElement("div"); el.className="day"+(k===keyForDate()?" today":"");
    el.innerHTML=`<div class="dnum">${d}</div><div class="dpts">${pts?pts+" ⭐":"—"}</div>`;
    grid.appendChild(el);
  }
  const total=monthTotal(kid);
  document.getElementById("calendarMonthTotal").textContent=`${total} ⭐`;
  document.getElementById("calendarMonthCaption").textContent=`${kid.name}'s ${now.toLocaleDateString(undefined,{month:"long"})} total`;
}
function renderRewards(){
  const kid=getKid(), total=monthTotal(kid), wrap=document.getElementById("rewardsList");wrap.innerHTML="";
  state.rewards.forEach(r=>{
    const unlocked=total>=r.points;
    const el=document.createElement("div"); el.className="reward";
    el.innerHTML=`<h3>${unlocked?"✅":"🔒"} ${escapeHtml(r.title)}</h3><small>${r.points} points • ${unlocked?"Unlocked!":"Need "+(r.points-total)+" more points"}</small>`;
    wrap.appendChild(el);
  });
}
function renderEditor(){
  const kid=getKid(), wrap=document.getElementById("taskEditor"); wrap.innerHTML="";
  kid.tasks.forEach((t,i)=>{
    const row=document.createElement("div"); row.className="edit-task";
    row.innerHTML=`<input type="text" value="${escapeAttr(t.name)}" data-name>
      <input type="number" min="1" value="${t.points}" data-points>
      <button class="danger">Delete</button>`;
    row.querySelector("[data-name]").onchange=e=>{t.name=e.target.value.trim()||t.name;renderAll()};
    row.querySelector("[data-points]").onchange=e=>{t.points=Math.max(1,Number(e.target.value)||1);renderAll()};
    row.querySelector("button").onclick=()=>{kid.tasks.splice(i,1);renderAll()};
    wrap.appendChild(row);
  });
}
function addTask(){
  const name=document.getElementById("newTaskName").value.trim();
  const pts=Math.max(1,Number(document.getElementById("newTaskPoints").value)||1);
  if(!name)return;
  getKid().tasks.push({id:"t"+Date.now(),name,points:pts});
  document.getElementById("newTaskName").value="";
  renderAll();
}
function addBonus(){
  const pts=Math.max(1,Number(document.getElementById("bonusPoints").value)||1);
  const rec=getDayRecord(); rec.bonus=(rec.bonus||0)+pts;
  showToast(`+${pts} ⭐ Bonus!`); renderAll();
}
function exportData(){
  const data="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(state,null,2));
  const a=document.createElement("a");a.href=data;a.download="kids-daily-stars-backup.json";a.click();
}
function resetAll(){
  if(confirm("Reset all tasks and history? This cannot be undone unless you exported a backup.")){
    state=structuredClone(defaultState);renderAll();
  }
}
function showToast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1200);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}

document.querySelectorAll(".navbtn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".navbtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(btn.dataset.panel).classList.add("active");
    if(btn.dataset.panel==="calendarPanel")renderCalendar();
  }
});

renderAll();
</script>
</body>
</html>
